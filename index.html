<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3742">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SEGURANÇA PRBBL">
<meta name="application-name" content="SEGURANÇA PRBBL">
<meta name="msapplication-TileColor" content="#0a3742">
<meta name="msapplication-config" content="browserconfig.xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" href="favicon.ico" sizes="any">
<title>SEGURANÇA PRBBL</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a3742;font-family:Arial,sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef2f3;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box}.splash{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#0a3742,#051f26);z-index:10;color:#fff;text-align:center}.splash img{width:148px;height:148px;border-radius:30px;box-shadow:0 10px 30px #0006}.splash h1{font-size:22px;letter-spacing:1.2px;margin:16px 0 5px}.splash p{font-size:12px;opacity:.72}.hidden{display:none!important}#net{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;padding:7px 11px;border-radius:999px;background:#a53a3a;color:#fff;font-size:11px;font-weight:bold;display:none}#install{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:21;border:0;border-radius:12px;padding:11px 14px;background:#b18a2e;color:white;font-weight:bold;box-shadow:0 5px 18px #0004;display:none;cursor:pointer}#install:hover{filter:brightness(1.08)}@media(min-width:900px){.splash img{width:170px;height:170px}.splash h1{font-size:26px}.splash p{font-size:13px}}
</style>
</head>
<body>
<div id="splash" class="splash"><div><img src="icon-192.png" alt="Brasão PRBBL"><h1>SEGURANÇA PRBBL</h1><p>Portal Operacional Integrado</p></div></div>
<div id="net">SEM CONEXÃO</div><button id="install">INSTALAR APP</button>
<iframe id="app" title="SEGURANÇA PRBBL" allow="camera *; geolocation *; clipboard-read *; clipboard-write *" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script src="config.js"></script>
<script>
const frame=document.getElementById('app'),splash=document.getElementById('splash'),net=document.getElementById('net'),install=document.getElementById('install');
let deferredPrompt=null;
function pwaUrl(url){if(!url)return '';if(/[?&]pwa=1(?:&|$)/.test(url))return url;return url+(url.includes('?')?'&':'?')+'pwa=1'}
function load(url){frame.src=pwaUrl(url)}
frame.addEventListener('load',()=>setTimeout(()=>splash.classList.add('hidden'),180));
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='PRBBL_NAV'&&d.url){frame.src=d.url;try{e.source.postMessage({type:'PRBBL_NAV_ACK'},'*')}catch(x){}}});
window.addEventListener('online',()=>net.style.display='none');window.addEventListener('offline',()=>net.style.display='block');if(!navigator.onLine)net.style.display='block';
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.textContent=/Windows/i.test(navigator.userAgent)?'INSTALAR NO WINDOWS':'INSTALAR APP';install.style.display='block'});
install.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.style.display='none'});
window.addEventListener('appinstalled',()=>install.style.display='none');
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
load(window.PRBBL_WEBAPP_URL);
</script>
</body>
</html>
