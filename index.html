<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3742">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SEGURANÇA PRBBL">
<meta name="application-name" content="SEGURANÇA PRBBL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>SEGURANÇA PRBBL</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061f26;font-family:Arial,sans-serif;color:#fff}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#125061 0,#0a3742 35%,#051b21 100%)}.card{width:min(430px,100%);text-align:center;padding:32px 24px;border:1px solid #ffffff24;border-radius:24px;background:#082b35e8;box-shadow:0 24px 70px #0008}.logo{width:138px;height:138px;border-radius:28px;box-shadow:0 12px 35px #0007;margin-bottom:16px}.eyebrow{font-size:11px;letter-spacing:2px;color:#d7b55a;font-weight:700}.title{font-size:26px;letter-spacing:1px;margin:8px 0 5px}.sub{font-size:13px;color:#bfd0d4;margin:0 0 24px}.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;background:#b18a2e;color:#fff;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none}.btn:active{transform:translateY(1px)}.status{margin-top:16px;font-size:12px;color:#a9c0c5}.note{margin-top:18px;font-size:11px;line-height:1.45;color:#8fa8ad}.offline{color:#ffcc80}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="icon-192.png" alt="PRBBL">
  <div class="eyebrow">PORTAL OPERACIONAL INTEGRADO</div>
  <h1 class="title">SEGURANÇA PRBBL</h1>
  <p class="sub">Acesso ao sistema operacional</p>
  <a id="open" class="btn" href="#">ABRIR PORTAL</a>
  <div id="status" class="status">Preparando acesso…</div>
  <div class="note">O Portal é aberto diretamente para evitar o bloqueio atual de iframe do Google Apps Script.</div>
</main>
<script src="config.js"></script>
<script>
const btn=document.getElementById('open');
const status=document.getElementById('status');
const url=String(window.PRBBL_WEBAPP_URL||'').trim();
function target(){return url+(url.includes('?')?'&':'?')+'pwa=1'}
function openPortal(e){if(e)e.preventDefault();if(!url){status.textContent='Endereço do Portal não configurado.';return}window.location.href=target()}
btn.addEventListener('click',openPortal);
if(!navigator.onLine){status.textContent='Sem conexão com a internet.';status.classList.add('offline')}else if(url){status.textContent='Pronto para abrir.'}else{status.textContent='Configuração ausente.'}
window.addEventListener('online',()=>{status.textContent='Pronto para abrir.';status.classList.remove('offline')});
window.addEventListener('offline',()=>{status.textContent='Sem conexão com a internet.';status.classList.add('offline')});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
